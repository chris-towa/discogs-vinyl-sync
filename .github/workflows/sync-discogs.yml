name: Sync Discogs Collection and Wantlist

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discogs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Discogs data
        env:
          DISCOGS_USERNAME: chris-towa
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/sync_discogs.py
      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update Discogs collection and wantlist"
            git push
          else
            echo "No changes"
          fi
