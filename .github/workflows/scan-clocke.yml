name: Scan clocke Discogs Inventory

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clocke-inventory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan clocke inventory
        env:
          DISCOGS_SELLER: clocke
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          PAGES_PER_RUN: '30'
          DISCOGS_REQUEST_DELAY: '4.0'
        run: python scripts/scan_seller.py
      - name: Save scan progress
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sellers/clocke/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint clocke inventory scan'
            git push
          else
            echo 'No new progress'
          fi
