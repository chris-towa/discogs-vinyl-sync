name: Scan Discogs Seller Inventory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan wgwstore full public inventory
        env:
          DISCOGS_SELLER: wgwstore
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/scan_seller.py
      - name: Commit inventory snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sellers/wgwstore/
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot wgwstore seller inventory"
            git push
          else
            echo "No changes"
          fi
